<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>SMEAC Planner — Meeting Planning Tool</title>
    <meta name="description" content="Plan your meetings using the SMEAC framework from Masterclass for Meetings by Christopher J. Riner. Free to try." />

    <!-- PWA -->
    <link rel="manifest" href="./manifest.json" />
    <meta name="theme-color" content="#0d0f12" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SMEAC" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />

    <!-- Open Graph -->
    <meta property="og:title" content="SMEAC Meeting Planner" />
    <meta property="og:description" content="Plan meetings that actually work. Based on the SMEAC framework from Masterclass for Meetings." />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js')
            .then(() => console.log('[smeac] Service worker registered'))
            .catch((e) => console.log('[smeac] SW registration failed:', e));
        });
      }
    </script>
  </body>
</html>
